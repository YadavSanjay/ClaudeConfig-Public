<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title id="t">How ClaudeConfig fits around Claude Code</title>
  <desc id="d">Global rules and skills load into every Claude Code session. Hooks and CI enforce the rules. Each skill writes its records to local storage that is never published.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="860" height="400" rx="12" fill="#ffffff"/>

  <g font-size="13" font-weight="600" fill="#334155">
    <text x="30" y="36">Loaded for every project</text>
    <text x="330" y="36">Agent session</text>
    <text x="620" y="36">Stays on your machine</text>
  </g>

  <g fill="#f1f5f9" stroke="#cbd5e1">
    <rect x="30" y="50" width="240" height="92" rx="8"/>
    <rect x="620" y="50" width="210" height="92" rx="8"/>
    <rect x="620" y="162" width="210" height="62" rx="8"/>
    <rect x="620" y="244" width="210" height="62" rx="8"/>
  </g>
  <rect x="30" y="162" width="240" height="144" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="330" y="50" width="230" height="256" rx="8" fill="#eff6ff" stroke="#93c5fd"/>

  <g font-size="13" fill="#0f172a">
    <text x="46" y="76" font-weight="600">Global conventions</text>
    <text x="46" y="98">CLAUDE.md, rules/python.md</text>
    <text x="46" y="118">standards/, policy/</text>

    <text x="46" y="188" font-weight="600">Skills</text>
    <text x="46" y="210">review-core, tdd-spec</text>
    <text x="46" y="232">cost-report</text>
    <text x="46" y="254">ai-harness-engineering</text>
    <text x="46" y="276">rag-ui-design</text>

    <text x="350" y="166" font-weight="600">Claude Code</text>
    <text x="350" y="188">points at this folder with</text>
    <text x="350" y="208">CLAUDE_CONFIG_DIR, in any repo</text>

    <text x="636" y="76" font-weight="600">Review records</text>
    <text x="636" y="98">runs, findings, outcomes</text>
    <text x="636" y="118">review-history/</text>

    <text x="636" y="188" font-weight="600">Test-first event log</text>
    <text x="636" y="208">tdd-history/</text>

    <text x="636" y="270" font-weight="600">Cost ledger</text>
    <text x="636" y="290">cost/ledger.db</text>
  </g>

  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M270 96H328"/>
    <path d="M270 234H328"/>
    <path d="M560 96H618"/>
    <path d="M560 193H618"/>
    <path d="M560 275H618"/>
  </g>

  <rect x="30" y="330" width="800" height="46" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="430" y="358" text-anchor="middle" font-size="13" fill="#0f172a">Hooks and CI enforce what the agent is told: agents read GitHub, humans push; locked tests stay locked; records stay out of git.</text>
</svg>
