# CI: the public-safety check, lint and each skill's tests. The skills use only the standard
# library and git, so the tests run on a plain runner with no network and no models.
name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

# Actions are pinned to commit SHAs (version in the trailing comment) and Python packages to exact
# versions in requirements-dev.txt; upgrade deliberately.
jobs:
  check:
    # Hosted minutes are free on public repos only.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - name: Install pinned dev deps
        run: pip install -r requirements-dev.txt
      - name: Public-safety check
        run: python scripts/check_public_safe.py
      - name: Ruff
        run: ruff check skills scripts --output-format github
      - name: Pytest
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          for tests in scripts/tests skills/*/tests; do
            python -m pytest "$tests" -q -p no:cacheprovider
          done
